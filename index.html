<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Briefing</title>
  <meta name="apple-mobile-web-app-title" content="Global Briefing">
  <meta name="application-name" content="Global Briefing">
  <link rel="apple-touch-icon" sizes="512x512" href="globalbriefing.png">
  <link rel="icon" type="image/png" sizes="512x512" href="globalbriefing.png">
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #fffdf8;
      --text: #111111;
      --muted: #444444;
      --line: #1f1f1f;
      --accent: #111111;
      --accent-soft: #ece7dc;
      --mint: #ece7dc;
      --peach: #f7f4ee;
      --shadow: none;
      --reader-size: 1.39rem;
      --reader-font: Georgia, "Times New Roman", Times, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 112px;
      font-family: var(--reader-font);
      color: var(--text);
      background: var(--bg);
    }

    .app {
      width: min(100%, 780px);
      margin: 0 auto;
      padding-top: 132px;
    }

    header {
      position: fixed;
      top: 0;
      left: 50%;
      width: min(100%, 780px);
      transform: translateX(-50%);
      z-index: 3;
      padding: 18px 48px 14px 16px;
      background: rgba(247, 244, 238, 0.96);
      border-bottom: 3px double var(--line);
      backdrop-filter: blur(8px);
    }

    .date {
      margin: 0 0 6px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.15;
      letter-spacing: 0;
      text-align: center;
    }

    .section-nav {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      scroll-behavior: smooth;
      cursor: grab;
      user-select: none;
    }

    .section-nav::-webkit-scrollbar {
      display: none;
    }

    .section-nav.is-dragging {
      cursor: grabbing;
      scroll-behavior: auto;
    }

    .section-link {
      flex: 0 0 auto;
      padding: 6px 8px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .section-link.is-active {
      color: var(--bg);
      background: var(--text);
    }

    .nav-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 6px;
      background: rgba(247, 244, 238, 0.98);
      border: 1px solid var(--line);
    }

    .nav-actions.is-open {
      display: flex;
    }

    .settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
    }

    .nav-actions.is-open + .settings-btn {
      display: none;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .action-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .action-btn:active,
    .action-btn:focus {
      background: var(--accent-soft);
      outline: none;
    }

    main {
      display: grid;
      gap: 0;
      padding: 12px 14px 18px;
    }

    .card {
      padding: 16px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      scroll-margin-top: 154px;
    }

    .hero {
      color: var(--text);
      background: transparent;
      border-top: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      box-shadow: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .tag {
      flex: 0 0 auto;
      padding: 3px 0;
      color: var(--accent);
      background: transparent;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero .tag {
      color: var(--accent);
      background: transparent;
    }

    .details {
      display: grid;
      gap: 9px;
    }

    .story-block {
      display: grid;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .story-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .story-title {
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.3;
    }

    .source-link {
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: var(--reader-size);
      line-height: 1.5;
    }

    .implication {
      margin-top: 4px;
      padding-top: 8px;
      color: var(--text);
      border-top: 1px solid var(--line);
      font-weight: 700;
    }

    .hero p {
      color: var(--muted);
    }

    .lookup-word {
      display: inline;
      padding: 0 1px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 0;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
    }

    .lookup-word:active,
    .lookup-word:focus {
      color: var(--text);
      background: var(--accent-soft);
      outline: none;
    }

    .hero .lookup-word:active,
    .hero .lookup-word:focus {
      color: var(--text);
      background: var(--mint);
    }

    .dictionary-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
      background: rgba(247, 244, 238, 0.98);
      border-top: 3px double var(--line);
      box-shadow: none;
    }

    .dictionary-inner {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    .dictionary-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dictionary-text {
      margin: 0;
      color: var(--text);
      font-size: var(--reader-size);
      line-height: 1.36;
    }

    .saved-view {
      display: none;
      padding: 12px 14px 18px;
    }

    .saved-view.is-active {
      display: block;
    }

    .saved-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 2px solid var(--line);
    }

    .saved-list,
    .saved-detail {
      display: grid;
      gap: 0;
    }

    .saved-item,
    .saved-card {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .saved-item {
      width: 100%;
      color: var(--text);
      background: transparent;
      border-top: 0;
      border-left: 0;
      border-right: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .is-hidden {
      display: none;
    }

    @media (min-width: 680px) {
      header {
        padding: 24px 54px 16px 22px;
      }

      .app {
        padding-top: 148px;
      }

      h1 {
        font-size: 2rem;
      }

      main {
        grid-template-columns: 1fr;
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="readableContent">

      <h1>Today's Global Briefing</h1>
      <nav class="section-nav" id="sectionNav" aria-label="Briefing sections"></nav>

        </button>

            <path d="M8 4v6h8V4"></path>

        <button class="action-btn" id="showSavedBtn" type="button" aria-label="Open saved briefings">

            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </button>
        <button class="action-btn" id="decreaseTextBtn" type="button" aria-label="Decrease text size">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18l5-12 5 12"></path>
            <path d="M6 14h6"></path>
            <path d="M16 18h5"></path>
          </svg>
        </button>
        <button class="action-btn" id="increaseTextBtn" type="button" aria-label="Increase text size">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18l5-12 5 12"></path>
            <path d="M6 14h6"></path>
            <path d="M18.5 13v6"></path>
            <path d="M15.5 16h6"></path>
          </svg>
        </button>
        <button class="action-btn" id="fontCycleBtn" type="button" aria-label="Change font">

            <path d="M8 13h6"></path>
            <path d="M18 8h2"></path>
            <path d="M19 7v2"></path>
          </svg>
        </button>
      </div>

          <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 0 1-2.98 2.98l-.04-.04A1.8 1.8 0 0 0 14.8 19.6a1.8 1.8 0 0 0-1.1 1.64V21.3a2.1 2.1 0 0 1-4.2 0v-.06A1.8 1.8 0 0 0 8.4 19.6a1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 0 1-2.98-2.98l.04-.04A1.8 1.8 0 0 0 3.8 15a1.8 1.8 0 0 0-1.64-1.1H2.1a2.1 2.1 0 0 1 0-4.2h.06A1.8 1.8 0 0 0 3.8 8.6a1.8 1.8 0 0 0-.36-1.98l-.04-.04A2.1 2.1 0 0 1 6.38 3.6l.04.04A1.8 1.8 0 0 0 8.4 4a1.8 1.8 0 0 0 1.1-1.64V2.3a2.1 2.1 0 0 1 4.2 0v.06A1.8 1.8 0 0 0 14.8 4a1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 0 1 2.98 2.98l-.04.04A1.8 1.8 0 0 0 19.4 8.6a1.8 1.8 0 0 0 1.64 1.1h.06a2.1 2.1 0 0 1 0 4.2h-.06A1.8 1.8 0 0 0 19.4 15z"></path>
        </svg>
      </button>
    </header>

    <main id="briefingView"></main>

    <section class="saved-view" id="savedView" aria-label="Saved briefings">
      <div class="saved-top">
        <h2>Saved Briefings</h2>
        <button class="action-btn" id="backToBriefingBtn" type="button" aria-label="Back to briefing">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
            <path d="M9 12h11"></path>
          </svg>
        </button>
      </div>
      <div class="saved-list" id="savedList"></div>
      <div class="saved-detail" id="savedDetail"></div>
    </section>
  </div>

  <aside class="dictionary-bar" aria-live="polite">
    <div class="dictionary-inner">
      <p class="dictionary-label">Offline Korean Dictionary</p>
      <p class="dictionary-text" id="dictionaryText">Tap any word in the briefing to see its Korean meaning.</p>
    </div>
  </aside>

    function initSectionNavDrag() {
      const nav = document.getElementById("sectionNav");
      let dragging = false;
      let dragged = false;
      let startX = 0;
      let startLeft = 0;

      nav.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        dragging = true;
        dragged = false;
        startX = event.pageX;
        startLeft = nav.scrollLeft;
        nav.classList.add("is-dragging");
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) return;
        const delta = event.pageX - startX;
        if (Math.abs(delta) > 4) dragged = true;
        nav.scrollLeft = startLeft - delta;
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
        nav.classList.remove("is-dragging");
      });

      nav.addEventListener("click", (event) => {
        if (!dragged) return;
        event.preventDefault();
        event.stopPropagation();
        dragged = false;
      }, true);
    }

    function makeWordsClickable(root = document.getElementById("readableContent")) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (node.parentElement.closest("script, style, button")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach((node) => {
        const fragment = document.createDocumentFragment();
        node.nodeValue.split(/(\b[A-Za-z][A-Za-z'-]*\b)/g).forEach((part) => {
          if (/^[A-Za-z][A-Za-z'-]*$/.test(part)) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "lookup-word";
            button.textContent = part;
            button.dataset.word = part;
            fragment.appendChild(button);
          } else {
            fragment.appendChild(document.createTextNode(part));
          }
        });
        node.parentNode.replaceChild(fragment, node);
      });
    }

    function getApiKeys(allowPrompt = true) {
      let newsKey = localStorage.getItem(newsApiKeyStorage) || "";
      let summaryKey = localStorage.getItem(summaryApiKeyStorage) || "";

      if (allowPrompt && (!newsKey || !summaryKey)) {
        promptForApiKeys();
        newsKey = localStorage.getItem(newsApiKeyStorage) || "";
        summaryKey = localStorage.getItem(summaryApiKeyStorage) || "";
      }

      return newsKey && summaryKey ? { newsKey, summaryKey } : null;

    function buildNewsApiUrl(section, newsKey) {
      const params = new URLSearchParams({
        lang: "en",
        country: "us",
        max: "1",
        apikey: newsKey
      });

      if (section.endpoint === "top-headlines") {
        params.set("category", section.category || "general");
        return `https://gnews.io/api/v4/top-headlines?${params.toString()}`;
      }

      params.set("q", section.query);
      return `https://gnews.io/api/v4/search?${params.toString()}`;
    }

    async function fetchArticleForSection(section, newsKey) {
      const response = await fetch(buildNewsApiUrl(section, newsKey));
      if (!response.ok) throw new Error(`News API error ${response.status}`);

      const data = await response.json();
      const article = data.articles && data.articles[0];
      if (!article) throw new Error(`No article found for ${section.title}`);

      return {
        title: article.title || section.title,
        source: article.source?.name || "News API",
        url: article.url || "",
        publishedAt: article.publishedAt || "",
        text: [
          article.title,
          article.description,
          article.content
        ].filter(Boolean).join("\n\n")
      };
    }

    function parseSummaryJson(text) {
      const cleaned = text.replace(/```json|```/g, "").trim();
      const start = cleaned.indexOf("{");
      const end = cleaned.lastIndexOf("}");
      if (start === -1 || end === -1) throw new Error("Summary API returned invalid JSON.");
      return JSON.parse(cleaned.slice(start, end + 1));
    }

    async function summarizeAndTranslateArticle(article, section, summaryKey) {
      const promptText = `You are an experienced journalist, editor, and analyst.
Read the news article content carefully and produce a detailed summary in exactly 4 paragraphs.
Accuracy is the highest priority. Do not speculate. Do not add information that is not contained in the article.
Each paragraph must be one English paragraph followed immediately by a Korean translation in parentheses.
Paragraph 1: explain the main news event and identify who, what, when, where, and why.
Paragraph 2: describe key developments, decisions, announcements, figures, dates, organizations, and stakeholders.
Paragraph 3: provide relevant background and context mentioned in the article.
Paragraph 4: analyze the significance and potential implications based only on the article.
Return JSON only in this format: {"paragraphs":["English. (Korean.)","English. (Korean.)","English. (Korean.)","English. (Korean.)"]}

Section: ${section.title}
Source: ${article.source}
Published: ${article.publishedAt}
URL: ${article.url}
Article content:
${article.text}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(summaryKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            responseMimeType: "application/json",
            temperature: 0.2
          }
        })
      });

      if (!response.ok) throw new Error(`Summary API error ${response.status}`);
      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const parsed = parseSummaryJson(text);
      if (!Array.isArray(parsed.paragraphs) || parsed.paragraphs.length < 4) {
        throw new Error("Summary API did not return four paragraphs.");
      }

      return parsed.paragraphs.slice(0, 4);
    }

    async function updateBriefingFromApis({ allowPrompt = true, auto = false } = {}) {
      const keys = getApiKeys(allowPrompt);
      const statusEl = document.getElementById("dictionaryText");
      if (!keys) {
        statusEl.textContent = "API keys are required to update the briefing.";
        return false;
      }

      try {
        const updatedSections = [];
        for (const [index, section] of sectionDefinitions.entries()) {
          statusEl.textContent = `Updating ${index + 1}/${sectionDefinitions.length}: ${section.title}`;
          const article = await fetchArticleForSection(section, keys.newsKey);
          const paragraphs = await summarizeAndTranslateArticle(article, section, keys.summaryKey);
          updatedSections.push({
            title: section.title,
            tag: section.tag,
            hero: section.hero,
            stories: [{
              title: article.title,
              source: article.source,
              url: article.url,
              publishedAt: article.publishedAt,
              paragraphs
            }]
          });
        }

        briefingSections = updatedSections;
        saveStoredBriefingSections(updatedSections);
        renderBriefingCards();
        renderSectionNav();
        makeWordsClickable();
        updateSectionNavForScroll();
        statusEl.textContent = `${auto ? "Auto update" : "Update"} complete: ${new Date().toLocaleTimeString("en-US")}`;
        return true;
      } catch (error) {
        statusEl.textContent = `Update failed: ${error.message}`;
        return false;
      }
    }

    function saveCurrentBriefingForAutoRefresh() {

    function schedulePeriodRefresh() {
      const now = new Date();
      const next = new Date(now);
      next.setHours(9, 0, 0, 0);
      if (now >= next) {
        next.setDate(next.getDate() + 1);
      }

      setTimeout(async () => {
        const latestDate = getRefreshDateKey();
        if (localStorage.getItem(refreshPeriodKey) !== latestDate) {
          if (!getApiKeys(false)) {
            document.getElementById("dictionaryText").textContent = "Auto update skipped. Add API keys in settings.";
            schedulePeriodRefresh();
            return;
          }
          saveCurrentBriefingForAutoRefresh();
          const updated = await updateBriefingFromApis({ allowPrompt: false, auto: true });
          if (updated) {
            localStorage.setItem(refreshPeriodKey, latestDate);
          } else {
            document.getElementById("dictionaryText").textContent = "Auto update failed. Check API keys or network.";
          }
        }
        schedulePeriodRefresh();
      }, next.getTime() - now.getTime());
    }

    function renderSavedList() {
      const savedList = document.getElementById("savedList");
      const savedDetail = document.getElementById("savedDetail");
      const briefings = getSavedBriefings();
      savedList.replaceChildren();
      savedDetail.replaceChildren();

      if (!briefings.length) {
        const empty = document.createElement("p");
        empty.className = "saved-item";
        empty.textContent = "No saved briefings yet.";
        savedList.appendChild(empty);
        makeWordsClickable(savedList);
        return;
      }

      briefings.forEach((briefing) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "saved-item";
        item.dataset.id = briefing.id;
        item.textContent = `${briefing.date} - saved ${briefing.savedAt}`;
        savedList.appendChild(item);
      });
    }

    function renderSavedDetail(id) {
      const savedDetail = document.getElementById("savedDetail");
      const briefing = getSavedBriefings().find((item) => item.id === id);
      savedDetail.replaceChildren();
      if (!briefing) return;

      briefing.cards.forEach((card) => {
        const article = document.createElement("article");
        article.className = "saved-card";

        const head = document.createElement("div");
        head.className = "card-head";

        const title = document.createElement("h2");
        title.textContent = card.title;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = card.tag;

        const details = document.createElement("div");
        details.className = "details";

        card.paragraphs.forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          details.appendChild(paragraph);
        });

        head.append(title, tag);
        article.append(head, details);
        savedDetail.appendChild(article);
      });

      makeWordsClickable(savedDetail);
    }

    updateBriefingDate();
    applyReaderSize();
    applyReaderFont();
    renderBriefingCards();
    renderSectionNav();
    initSectionNavDrag();
    makeWordsClickable();
    schedulePeriodRefresh();
    window.addEventListener("scroll", updateSectionNavForScroll, { passive: true });
    window.addEventListener("resize", updateSectionNavForScroll);

    document.getElementById("settingsBtn").addEventListener("click", () => {
      document.getElementById("settingsPanel").classList.add("is-open");
    });

    document.getElementById("readableContent").addEventListener("click", (event) => {
      if (!event.target.closest(".nav-actions, .settings-btn")) {
        document.getElementById("settingsPanel").classList.remove("is-open");
      }
      const word = event.target.closest(".lookup-word");
      if (!word) return;
      document.getElementById("dictionaryText").textContent = `${word.dataset.word}: ${findMeaning(word.dataset.word)}`;
    });

    document.getElementById("updateBriefingBtn").addEventListener("click", () => updateBriefingFromApis());
    document.getElementById("apiKeysBtn").addEventListener("click", promptForApiKeys);
    document.getElementById("saveBriefingBtn").addEventListener("click", saveCurrentBriefing);
    document.getElementById("showSavedBtn").addEventListener("click", showSavedView);
    document.getElementById("decreaseTextBtn").addEventListener("click", () => changeReaderSize(-0.04));
    document.getElementById("increaseTextBtn").addEventListener("click", () => changeReaderSize(0.04));
    document.getElementById("fontCycleBtn").addEventListener("click", cycleReaderFont);
    document.getElementById("backToBriefingBtn").addEventListener("click", showBriefingView);
    document.getElementById("savedList").addEventListener("click", (event) => {
      const item = event.target.closest(".saved-item[data-id]");
      if (!item) return;
      renderSavedDetail(item.dataset.id);
    });

    setInterval(updateBriefingDate, 60 * 60 * 1000);
  </script>
</body>
</html>
