<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Briefing</title>
  <meta name="apple-mobile-web-app-title" content="Global Briefing">
  <meta name="application-name" content="Global Briefing">
  <link rel="apple-touch-icon" sizes="512x512" href="globalbriefing.png">
  <link rel="icon" type="image/png" sizes="512x512" href="globalbriefing.png">
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #fffdf8;
      --text: #111111;
      --muted: #444444;
      --line: #1f1f1f;
      --accent: #111111;
      --accent-soft: #ece7dc;
      --mint: #ece7dc;
      --peach: #f7f4ee;
      --shadow: none;
      --reader-size: 1.39rem;
      --reader-font: Georgia, "Times New Roman", Times, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 112px;
      font-family: var(--reader-font);
      color: var(--text);
      background: var(--bg);
    }

    .app {
      width: min(100%, 780px);
      margin: 0 auto;
      padding-top: 132px;
    }

    header {
      position: fixed;
      top: 0;
      left: 50%;
      width: min(100%, 780px);
      transform: translateX(-50%);
      z-index: 3;
      padding: 18px 48px 14px 16px;
      background: rgba(247, 244, 238, 0.96);
      border-bottom: 3px double var(--line);
      backdrop-filter: blur(8px);
    }

    .date {
      margin: 0 0 6px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.15;
      letter-spacing: 0;
      text-align: center;
    }

    .section-nav {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      scroll-behavior: smooth;
      cursor: grab;
      user-select: none;
    }

    .section-nav::-webkit-scrollbar {
      display: none;
    }

    .section-nav.is-dragging {
      cursor: grabbing;
      scroll-behavior: auto;
    }

    .section-link {
      flex: 0 0 auto;
      padding: 6px 8px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .section-link.is-active {
      color: var(--bg);
      background: var(--text);
    }

    .nav-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 6px;
      background: rgba(247, 244, 238, 0.98);
      border: 1px solid var(--line);
    }

    .nav-actions.is-open {
      display: flex;
    }

    .settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
    }

    .nav-actions.is-open + .settings-btn {
      display: none;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .action-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .action-btn:active,
    .action-btn:focus {
      background: var(--accent-soft);
      outline: none;
    }

    main {
      display: grid;
      gap: 0;
      padding: 12px 14px 18px;
    }

    .card {
      padding: 16px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      scroll-margin-top: 154px;
    }

    .hero {
      color: var(--text);
      background: transparent;
      border-top: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      box-shadow: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .tag {
      flex: 0 0 auto;
      padding: 3px 0;
      color: var(--accent);
      background: transparent;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero .tag {
      color: var(--accent);
      background: transparent;
    }

    .details {
      display: grid;
      gap: 9px;
    }

    .story-block {
      display: grid;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .story-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .story-title {
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.3;
    }

    .source-link {
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: var(--reader-size);
      line-height: 1.5;
    }

    .implication {
      margin-top: 4px;
      padding-top: 8px;
      color: var(--text);
      border-top: 1px solid var(--line);
      font-weight: 700;
    }

    .hero p {
      color: var(--muted);
    }

    .lookup-word {
      display: inline;
      padding: 0 1px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 0;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
    }

    .lookup-word:active,
    .lookup-word:focus {
      color: var(--text);
      background: var(--accent-soft);
      outline: none;
    }

    .hero .lookup-word:active,
    .hero .lookup-word:focus {
      color: var(--text);
      background: var(--mint);
    }

    .dictionary-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
      background: rgba(247, 244, 238, 0.98);
      border-top: 3px double var(--line);
      box-shadow: none;
    }

    .dictionary-inner {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    .dictionary-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dictionary-text {
      margin: 0;
      color: var(--text);
      font-size: var(--reader-size);
      line-height: 1.36;
    }

    .saved-view {
      display: none;
      padding: 12px 14px 18px;
    }

    .saved-view.is-active {
      display: block;
    }

    .saved-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 2px solid var(--line);
    }

    .saved-list,
    .saved-detail {
      display: grid;
      gap: 0;
    }

    .saved-item,
    .saved-card {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .saved-item {
      width: 100%;
      color: var(--text);
      background: transparent;
      border-top: 0;
      border-left: 0;
      border-right: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .is-hidden {
      display: none;
    }

    @media (min-width: 680px) {
      header {
        padding: 24px 54px 16px 22px;
      }

      .app {
        padding-top: 148px;
      }

      h1 {
        font-size: 2rem;
      }

      main {
        grid-template-columns: 1fr;
        padding: 22px;
      }
    }
  </style>
</head>

        <button class="action-btn" id="decreaseTextBtn" type="button" aria-label="Decrease text size">

          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path>
          <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 0 1-2.98 2.98l-.04-.04A1.8 1.8 0 0 0 14.8 19.6a1.8 1.8 0 0 0-1.1 1.64V21.3a2.1 2.1 0 0 1-4.2 0v-.06A1.8 1.8 0 0 0 8.4 19.6a1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 0 1-2.98-2.98l.04-.04A1.8 1.8 0 0 0 3.8 15a1.8 1.8 0 0 0-1.64-1.1H2.1a2.1 2.1 0 0 1 0-4.2h.06A1.8 1.8 0 0 0 3.8 8.6a1.8 1.8 0 0 0-.36-1.98l-.04-.04A2.1 2.1 0 0 1 6.38 3.6l.04.04A1.8 1.8 0 0 0 8.4 4a1.8 1.8 0 0 0 1.1-1.64V2.3a2.1 2.1 0 0 1 4.2 0v.06A1.8 1.8 0 0 0 14.8 4a1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 0 1 2.98 2.98l-.04.04A1.8 1.8 0 0 0 19.4 8.6a1.8 1.8 0 0 0 1.64 1.1h.06a2.1 2.1 0 0 1 0 4.2h-.06A1.8 1.8 0 0 0 19.4 15z"></path>
        </svg>
      </button>
    </header>

    <main id="briefingView"></main>

    <section class="saved-view" id="savedView" aria-label="Saved briefings">
      <div class="saved-top">
        <h2>Saved Briefings</h2>
        <button class="action-btn" id="backToBriefingBtn" type="button" aria-label="Back to briefing">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
            <path d="M9 12h11"></path>
          </svg>
        </button>
      </div>
      <div class="saved-list" id="savedList"></div>
      <div class="saved-detail" id="savedDetail"></div>
    </section>
  </div>

    <div class="dictionary-inner">
      <p class="dictionary-label">Offline Korean Dictionary</p>
      <p class="dictionary-text" id="dictionaryText">Tap any word in the briefing to see its Korean meaning.</p>
    </div>
  </aside>

    function renderBriefingCards() {
      const main = document.getElementById("briefingView");
      main.replaceChildren();

      briefingSections.forEach((section, sectionIndex) => {
        const card = document.createElement("article");
        card.className = section.hero ? "card hero" : "card";
        card.id = `section-${sectionIndex}`;

        const head = document.createElement("div");
        head.className = "card-head";

        const title = document.createElement("h2");
        title.textContent = section.title;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = section.tag;

        const details = document.createElement("div");
        details.className = "details";

        const story = section.stories[0];
        const block = document.createElement("section");
        block.className = "story-block";

        if (!story) {
          const empty = document.createElement("p");
          empty.textContent = "No briefing article is available yet.";
          block.appendChild(empty);
          details.appendChild(block);
          head.append(title, tag);
          card.append(head, details);
          main.appendChild(card);
          return;
        }

        const storyTitle = document.createElement("h3");
        storyTitle.className = "story-title";
        storyTitle.textContent = `Selected Article: ${story.title}`;
        block.appendChild(storyTitle);

        if (story.source && story.url) {
          const source = document.createElement("a");
          source.className = "source-link";
          source.href = story.url;
          source.target = "_blank";
          source.rel = "noopener noreferrer";
          source.textContent = `Source: ${story.source}`;
          block.appendChild(source);
        }

        getOriginalArticleSummary(story).forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          block.appendChild(paragraph);
        });

        details.appendChild(block);

        head.append(title, tag);
        card.append(head, details);
        main.appendChild(card);
      });
    }

    function renderSectionNav() {
      const nav = document.getElementById("sectionNav");
      nav.replaceChildren();

      briefingSections.forEach((section, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "section-link";
        button.dataset.sectionIndex = index;
        button.textContent = section.title.replace("Today's Biggest Story", "Top Story");
        button.addEventListener("click", () => {
          const target = document.getElementById(`section-${index}`);
          const headerOffset = document.querySelector("header").offsetHeight + 12;
          window.scrollTo({ top: target.offsetTop - headerOffset, behavior: "smooth" });
        });
        nav.appendChild(button);
      });

      updateSectionNavForScroll();
    }

    function setActiveSectionNav(index) {
      const nav = document.getElementById("sectionNav");
      const active = nav.querySelector(`[data-section-index="${index}"]`);
      if (!active || active.classList.contains("is-active")) return;

      nav.querySelectorAll(".section-link").forEach((button) => {
        button.classList.toggle("is-active", button === active);
      });
      nav.scrollTo({
        left: active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2,
        behavior: "smooth"
      });
    }

    function updateSectionNavForScroll() {
      const headerOffset = document.querySelector("header").offsetHeight + 16;
      let activeIndex = 0;

      briefingSections.forEach((section, index) => {
        const card = document.getElementById(`section-${index}`);
        if (card && card.getBoundingClientRect().top <= headerOffset) {
          activeIndex = index;
        }
      });

      setActiveSectionNav(activeIndex);
    }

    function initSectionNavDrag() {
      const nav = document.getElementById("sectionNav");
      let dragging = false;
      let dragged = false;
      let startX = 0;
      let startLeft = 0;

      nav.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        dragging = true;
        dragged = false;
        startX = event.pageX;
        startLeft = nav.scrollLeft;
        nav.classList.add("is-dragging");
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging) return;
        const delta = event.pageX - startX;
        if (Math.abs(delta) > 4) dragged = true;
        nav.scrollLeft = startLeft - delta;
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
        nav.classList.remove("is-dragging");
      });

      nav.addEventListener("click", (event) => {
        if (!dragged) return;
        event.preventDefault();
        event.stopPropagation();
        dragged = false;
      }, true);
    }

    function cleanSummaryLead(text) {
      return text
        .replace(/^The first .*? is /, "")
        .replace(/^The second .*? is /, "")
        .replace(/^It is .*? because /, "")
        .replace(/^It matters because /, "")
        .replace(/^It attracts attention because /, "")
        .replace(/^It draws attention because /, "")
        .replace(/^Readers care because /, "")
        .replace(/^Readers should watch /, "")
        .replace(/^The next signal is /, "")
        .replace(/^The important signals are /, "")
        .replace(/^The bottom line is /, "")
        .replace(/^The key point is /, "")
        .replace(/^The .*? takeaway is /, "");
    }

    function getOriginalArticleSummary(story) {
      return story.paragraphs && story.paragraphs.length
        ? story.paragraphs
        : ["Briefing summary pending."];
    }

    function makeWordsClickable(root = document.getElementById("readableContent")) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (node.parentElement.closest("script, style, button")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach((node) => {
        const fragment = document.createDocumentFragment();
        node.nodeValue.split(/(\b[A-Za-z][A-Za-z'-]*\b)/g).forEach((part) => {
          if (/^[A-Za-z][A-Za-z'-]*$/.test(part)) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "lookup-word";
            button.textContent = part;
            button.dataset.word = part;
            fragment.appendChild(button);
          } else {
            fragment.appendChild(document.createTextNode(part));
          }
        });
        node.parentNode.replaceChild(fragment, node);
      });
    }

    const storageKey = "globalBriefing.savedBriefings";
    const refreshPeriodKey = "globalBriefing.dailyRefreshDate";

    function getSavedBriefings() {
      return JSON.parse(localStorage.getItem(storageKey) || "[]");
    }

    function setSavedBriefings(briefings) {
      localStorage.setItem(storageKey, JSON.stringify(briefings));
    }

    function collectCurrentBriefing() {
      const cards = [...document.querySelectorAll("#briefingView .card")].map((card) => ({
        title: card.querySelector("h2").textContent.trim(),
        tag: card.querySelector(".tag").textContent.trim(),
        paragraphs: [...card.querySelectorAll(".details p")].map((paragraph) => paragraph.textContent.trim())
      }));

      return {
        id: Date.now().toString(),
        title: document.querySelector("h1").textContent.trim(),
        date: document.getElementById("briefingDate").textContent.trim(),
        savedAt: new Date().toLocaleString("en-US"),
        cards
      };
    }

    function saveCurrentBriefing() {
      const briefings = getSavedBriefings();
      const current = collectCurrentBriefing();
      briefings.unshift(current);
      setSavedBriefings(briefings.slice(0, 20));
      renderSavedList();
      document.getElementById("dictionaryText").textContent = `Saved: ${current.date}`;
    }

    function getRefreshDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const dateNumber = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${dateNumber}`;
    }

    function saveCurrentBriefingForAutoRefresh() {
      const briefings = getSavedBriefings();
      const current = collectCurrentBriefing();
      current.savedAt = `${new Date().toLocaleString("en-US")} auto refresh`;
      briefings.unshift(current);
      setSavedBriefings(briefings.slice(0, 20));
    }

    function schedulePeriodRefresh() {
      const now = new Date();
      const next = new Date(now);
      next.setHours(9, 0, 0, 0);
      if (now >= next) {
        next.setDate(next.getDate() + 1);
      }

      setTimeout(async () => {
        const latestDate = getRefreshDateKey();
        if (localStorage.getItem(refreshPeriodKey) !== latestDate) {
          saveCurrentBriefingForAutoRefresh();
          localStorage.setItem(refreshPeriodKey, latestDate);
          location.reload();
        }
        schedulePeriodRefresh();
      }, next.getTime() - now.getTime());
    }

    function showBriefingView() {
      document.getElementById("briefingView").classList.remove("is-hidden");
      document.getElementById("savedView").classList.remove("is-active");
      document.getElementById("savedDetail").replaceChildren();
    }

    function showSavedView() {
      renderSavedList();
      document.getElementById("briefingView").classList.add("is-hidden");
      document.getElementById("savedView").classList.add("is-active");
    }

    function renderSavedList() {
      const savedList = document.getElementById("savedList");
      const savedDetail = document.getElementById("savedDetail");
      const briefings = getSavedBriefings();
      savedList.replaceChildren();
      savedDetail.replaceChildren();

      if (!briefings.length) {
        const empty = document.createElement("p");
        empty.className = "saved-item";
        empty.textContent = "No saved briefings yet.";
        savedList.appendChild(empty);
        makeWordsClickable(savedList);
        return;
      }

      briefings.forEach((briefing) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "saved-item";
        item.dataset.id = briefing.id;
        item.textContent = `${briefing.date} - saved ${briefing.savedAt}`;
        savedList.appendChild(item);
      });
    }

    function renderSavedDetail(id) {
      const savedDetail = document.getElementById("savedDetail");
      const briefing = getSavedBriefings().find((item) => item.id === id);
      savedDetail.replaceChildren();
      if (!briefing) return;

      briefing.cards.forEach((card) => {
        const article = document.createElement("article");
        article.className = "saved-card";

        const head = document.createElement("div");
        head.className = "card-head";

        const title = document.createElement("h2");
        title.textContent = card.title;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = card.tag;

        const details = document.createElement("div");
        details.className = "details";

        card.paragraphs.forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          details.appendChild(paragraph);
        });

        head.append(title, tag);
        article.append(head, details);
        savedDetail.appendChild(article);
      });

      makeWordsClickable(savedDetail);
    }

    updateBriefingDate();
    applyReaderSize();
    applyReaderFont();
    renderBriefingCards();
    renderSectionNav();
    initSectionNavDrag();
    makeWordsClickable();
    schedulePeriodRefresh();
    window.addEventListener("scroll", updateSectionNavForScroll, { passive: true });
    window.addEventListener("resize", updateSectionNavForScroll);

    document.getElementById("settingsBtn").addEventListener("click", () => {
      document.getElementById("settingsPanel").classList.add("is-open");
    });

    document.getElementById("readableContent").addEventListener("click", (event) => {
      if (!event.target.closest(".nav-actions, .settings-btn")) {
        document.getElementById("settingsPanel").classList.remove("is-open");
      }
      const word = event.target.closest(".lookup-word");
      if (!word) return;
      document.getElementById("dictionaryText").textContent = `${word.dataset.word}: ${findMeaning(word.dataset.word)}`;
    });

    document.getElementById("saveBriefingBtn").addEventListener("click", saveCurrentBriefing);
    document.getElementById("showSavedBtn").addEventListener("click", showSavedView);
    document.getElementById("decreaseTextBtn").addEventListener("click", () => changeReaderSize(-0.04));
    document.getElementById("increaseTextBtn").addEventListener("click", () => changeReaderSize(0.04));
    document.getElementById("fontCycleBtn").addEventListener("click", cycleReaderFont);
    document.getElementById("backToBriefingBtn").addEventListener("click", showBriefingView);
    document.getElementById("savedList").addEventListener("click", (event) => {
      const item = event.target.closest(".saved-item[data-id]");
      if (!item) return;
      renderSavedDetail(item.dataset.id);
    });

    setInterval(updateBriefingDate, 60 * 60 * 1000);
  </script>
</body>
</html>
